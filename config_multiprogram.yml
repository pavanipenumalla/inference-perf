load:
  type: multi_program
  fairness:
    header_key: "x-gateway-inference-fairness-id"
  programs:
    - name: "fg-heavy-aggressive-000"
      total_requests: 10
      concurrency: 5
      prompt_tokens: 256
      max_tokens: 64
      start_time: 0

    - name: "fg-light-polite-001"
      total_requests: 10
      concurrency: 2
      prompt_tokens: 64
      max_tokens: 32
      start_time: 0

    - name: "fg-anonymous-002"
      total_requests: 5
      concurrency: 2
      prompt_tokens: 128
      max_tokens: 32
      start_time: 3.0
      no_fairness_header: true

api:
  type: completion
  streaming: true
  # Add your API key in config_local.yml (gitignored), not here.
  # headers:
  #   RITS_API_KEY: "your-key-here"

server:
  type: vllm
  model_name: openai/gpt-oss-120b
  base_url: https://inference-3scale-apicast-production.apps.rits.fmaas.res.ibm.com/gpt-oss-120b
  ignore_eos: true

tokenizer:
  pretrained_model_name_or_path: openai/gpt-oss-120b

report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
