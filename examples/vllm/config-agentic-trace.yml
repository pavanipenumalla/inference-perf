api:
  type: chat
  streaming: true
  headers:
    RITS_API_KEY: <RITS_KEY>

server:
  type: vllm
  model_name: <model_name>
  base_url: <url>
  ignore_eos: true

load:
  type: agentic_trace
  fairness:
    header_key: "x-gateway-inference-fairness-id"
  agentic_trace:
    trace_file: "sharegpt_trace.json"
    arrival_rate: 1.0
    total_programs: 3
    max_concurrency: 50
    content_mode: "original"

storage:
  local_storage:
    path: "reports-agentic-trace-sharegpt"
